name: sdk-publish

on:
  push:
    tags: ['sdk-v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Derive version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#sdk-v}" >> "$GITHUB_ENV"

      - name: Pack
        run: dotnet pack src/Bump.Sdk/Bump.Sdk.csproj -c Release -p:Version=$VERSION -o out

      - name: Push to GitHub Packages
        run: >
          dotnet nuget push out/*.nupkg
          --source https://nuget.pkg.github.com/daniel-miller/index.json
          --api-key ${{ secrets.GITHUB_TOKEN }}
